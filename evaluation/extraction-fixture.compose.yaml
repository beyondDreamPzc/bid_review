# Explicit synthetic integration fixture; never used by the normal compose command.
services:
  api:
    environment: &fixture-model
      BID_LLM_ENABLED: "true"
      BID_LLM_BASE_URL: http://model-fixture:19091/v1
      BID_LLM_API_KEY: synthetic-local-contract-token
      BID_LLM_MODEL: synthetic-contract-fixture
      BID_LLM_ALLOW_INSECURE_HTTP: "true"
      BID_LLM_OUTPUT_MODE: json_schema
  extraction-worker:
    environment: *fixture-model
  model-fixture:
    image: bid-review-app:0.7.0
    command: ["python", "tests/support/model_fixture.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:19091/health',timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
