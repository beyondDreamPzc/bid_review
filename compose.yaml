name: bid-review-phase1

x-app: &app
  image: bid-review-app:0.8.0
  environment: &app-environment
    BID_DATABASE_URL: mysql+pymysql://bid_user:${MYSQL_PASSWORD:?Run scripts/init_env.py}@mysql:3306/bid_review?charset=utf8mb4
    BID_REDIS_URL: redis://redis:6379/0
    BID_STORAGE_PATH: /data/blobs
    BID_BOOTSTRAP_API_KEY: ${BID_BOOTSTRAP_API_KEY:?Run scripts/init_env.py}
    BID_DEMO_ENABLED: ${BID_DEMO_ENABLED:-true}
    BID_PARSER_PROFILE: ${BID_PARSER_PROFILE:-mineru-4.0.12-flash-auto-v1}
    BID_RETRIEVAL_ENABLED: ${BID_RETRIEVAL_ENABLED:-true}
    BID_MILVUS_URL: http://milvus:19530
  volumes:
    - documents:/data/blobs
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

x-llm-environment: &llm-environment
  <<: *app-environment
  BID_LLM_ENABLED: ${BID_LLM_ENABLED:-false}
  BID_LLM_BASE_URL: ${BID_LLM_BASE_URL:-https://api.openai.com/v1}
  BID_LLM_API_KEY: ${BID_LLM_API_KEY:-}
  BID_LLM_MODEL: ${BID_LLM_MODEL:-}
  BID_LLM_OUTPUT_MODE: ${BID_LLM_OUTPUT_MODE:-json_schema}
  BID_LLM_TOKEN_PARAMETER: ${BID_LLM_TOKEN_PARAMETER:-max_completion_tokens}
  BID_LLM_TIMEOUT_SECONDS: ${BID_LLM_TIMEOUT_SECONDS:-45}
  BID_LLM_MAX_OUTPUT_TOKENS: ${BID_LLM_MAX_OUTPUT_TOKENS:-4096}
  BID_LLM_ALLOW_INSECURE_HTTP: ${BID_LLM_ALLOW_INSECURE_HTTP:-false}

services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_DATABASE: bid_review
      MYSQL_USER: bid_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init_env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init_env.py}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -ubid_user -D bid_review -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  bootstrap:
    <<: *app
    command: ["python", "-m", "app.cli", "bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    environment: *llm-environment
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:18080:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    image: bid-review-parser:0.8.0
    build:
      context: .
      target: mineru-worker
    environment:
      <<: *app-environment
      BID_MINERU_PYTHON: /opt/mineru/bin/python
      BID_MINERU_TIMEOUT_SECONDS: ${BID_MINERU_TIMEOUT_SECONDS:-900}
      MINERU_HOME: /data/mineru
      MINERU_MODEL_SMALL_BACKEND: onnx
      MINERU_TABLE_DEVICE: cpu
    volumes:
      - documents:/data/blobs
      - mineru_models:/data/mineru
    command: ["python", "-m", "celery", "-A", "app.worker:celery_app", "worker", "-Q", "parse", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  dispatcher:
    <<: *app
    command: ["python", "-m", "app.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  extraction-worker:
    <<: *app
    environment: *llm-environment
    command: ["python", "-m", "celery", "-A", "app.worker:celery_app", "worker", "-Q", "extract", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  retrieval-worker:
    <<: *app
    command: ["python", "-m", "celery", "-A", "app.worker:celery_app", "worker", "-Q", "retrieve", "--concurrency=1", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy

  milvus:
    image: milvusdb/milvus:v2.6.6@sha256:38a6ba6378c602bfb187f4f34077f384c160edf1cf329aa22d99fb58b81b2497
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
      - ./config/milvus-embed.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 18

volumes:
  mysql_data:
  redis_data:
  documents:
  mineru_models:
  milvus_data:
